name: Sanitize Build & Test

# Default (push): build the TS packages and run the document-sanitization tests
# against the COMMITTED pdfium.wasm (~1.5 min, measured). The Docker WASM rebuild runs
# ONLY on manual dispatch with rebuild_wasm=true — used when the EPDF_* C++ changes
# (then download the 'pdfium-vendor' artifact and commit it). This keeps routine
# CI fast and the heavy build off the contributor's machine.

on:
  push:
    branches: [feat/document-sanitization, feat/ocg-removal]
  workflow_dispatch:
    inputs:
      rebuild_wasm:
        description: 'Rebuild pdfium.wasm from source in Docker (~20 min total, measured). Off = use committed wasm.'
        type: boolean
        default: false

concurrency:
  group: sanitize-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt JS actions into Node 24 (Node 20 is deprecated on GH runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (PDFium build needs ~25GB)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_wasm }}
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Checkout monorepo (submodule cloned standalone below)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Materialize pdfium-src as a standalone clone
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_wasm }}
        # gclient runs `git config --local` inside pdfium-src; a submodule
        # gitdir-link does not resolve inside the Docker container, so clone the
        # fork as a real repo (own .git dir) at the exact pinned gitlink commit.
        run: |
          set -euo pipefail
          SHA=$(git ls-tree HEAD packages/pdfium/pdfium-src | awk '{print $3}')
          echo "pdfium-src pinned at $SHA"
          rm -rf packages/pdfium/pdfium-src
          git clone --filter=blob:none https://github.com/Phauks/pdfium.git packages/pdfium/pdfium-src
          git -C packages/pdfium/pdfium-src checkout "$SHA"
          test -d packages/pdfium/pdfium-src/.git && echo "standalone .git OK"

      - name: Build pdfium.wasm in Docker (gclient sync + ninja, ~18 min measured)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_wasm }}
        working-directory: packages/pdfium
        # The container runs as root but the bind-mounted repo is owned by the
        # runner uid, so git's dubious-ownership guard makes gclient's
        # `git config --local` fail ("not a git repository"). Inject safe.directory
        # via env (GIT_CONFIG_*) so every in-container git call trusts the tree —
        # without modifying upstream build.sh. Both the wildcard (git >= 2.35.3)
        # and the explicit path (older git) are set for portability.
        # Robust build: (1) verify the bind mount loudly (run #5 hit a flaky
        # mount that looked like a code error); (2) upgrade git so depot_tools'
        # python bootstrap works; (3) run our ci-build.sh, which uses the author's
        # working dev.sh gn-gen form (cd into src, no --root) — no in-place sed.
        # safe.directory env handles root-vs-runner ownership of the mounted tree.
        run: |
          set -euo pipefail
          docker compose build pdfium-build
          docker compose run --rm \
            -e GIT_CONFIG_COUNT=2 \
            -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -e GIT_CONFIG_KEY_1=safe.directory -e GIT_CONFIG_VALUE_1=/workspace/packages/pdfium/pdfium-src \
            --entrypoint bash \
            pdfium-build -lc '
              set -eux
              if [ ! -f /workspace/packages/pdfium/scripts/ci-build.sh ]; then
                echo "BIND MOUNT MISSING: /workspace not mounted — pivot to a cloud VM build"
                ls -la /workspace || true
                ls -la /workspace/packages/pdfium/scripts || true
                exit 1
              fi
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends software-properties-common
              add-apt-repository -y ppa:git-core/ppa
              apt-get update
              apt-get install -y git
              git --version
              export PATH="$PATH:/opt/depot-tools"
              # Trigger depot_tools to (re)bootstrap its cipd python with the new git.
              gclient --version || true
              bash /workspace/packages/pdfium/scripts/ci-build.sh
            '

      - name: Show freshly vendored artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_wasm }}
        run: |
          ls -la packages/pdfium/src/vendor/
          echo '--- changed files vs committed baseline ---'
          git status --short

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build TS packages (engines + deps)
        run: pnpm --filter "@embedpdf/engines..." build

      - name: Build + verify the dirty fixture
        working-directory: packages/engines/examples/node/sanitize
        run: |
          node build-dirty-fixture.mjs
          node verify-dirty-fixture.mjs
          node baseline-check.mjs

      - name: Run sanitize vector tests (auto-discovers test-*.mjs)
        working-directory: packages/engines/examples/node/sanitize
        run: |
          set -euo pipefail
          shopt -s nullglob
          ran=0
          for f in test-*.mjs; do
            echo "==== $f ===="
            node "$f"
            ran=$((ran+1))
          done
          echo "ran $ran sanitize test file(s)"

      - name: Upload built wasm + bindings
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_wasm }}
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-vendor
          path: |
            packages/pdfium/src/vendor/pdfium.wasm
            packages/pdfium/src/vendor/functions.ts
            packages/pdfium/src/vendor/runtime-methods.ts
            packages/pdfium/src/vendor/pdfium.js
            packages/pdfium/src/vendor/pdfium.cjs
          if-no-files-found: warn
