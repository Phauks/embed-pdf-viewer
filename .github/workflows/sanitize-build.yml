name: Sanitize Build & Test

# Builds pdfium.wasm from the (forked) pdfium-src submodule in Docker on a Linux
# runner, then builds the TS packages and runs the document-sanitization tests
# against a crafted dirty fixture. This moves the heavy PDFium WASM build off the
# contributor's machine. Triggered on push to the feature branch or manually.

on:
  push:
    branches: [feat/document-sanitization]
  workflow_dispatch: {}

concurrency:
  group: sanitize-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (PDFium build needs ~25GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Checkout (recursive — pulls the pdfium-src fork submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build pdfium.wasm in Docker (gclient sync + ninja, cold ~45-60min)
        working-directory: packages/pdfium
        run: |
          set -euo pipefail
          docker compose build pdfium-build
          docker compose run --rm pdfium-build

      - name: Show freshly vendored artifacts
        run: |
          ls -la packages/pdfium/src/vendor/
          echo '--- changed files vs committed baseline ---'
          git status --short

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build TS packages (engines + deps)
        run: pnpm --filter "@embedpdf/engines..." build

      - name: Build + verify the dirty fixture
        working-directory: packages/engines/examples/node/sanitize
        run: |
          node build-dirty-fixture.mjs
          node verify-dirty-fixture.mjs
          node baseline-check.mjs

      - name: Run sanitize vector tests (auto-discovers test-*.mjs)
        working-directory: packages/engines/examples/node/sanitize
        run: |
          set -euo pipefail
          shopt -s nullglob
          ran=0
          for f in test-*.mjs; do
            echo "==== $f ===="
            node "$f"
            ran=$((ran+1))
          done
          echo "ran $ran sanitize test file(s)"

      - name: Upload built wasm + bindings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-vendor
          path: |
            packages/pdfium/src/vendor/pdfium.wasm
            packages/pdfium/src/vendor/functions.ts
            packages/pdfium/src/vendor/runtime-methods.ts
            packages/pdfium/src/vendor/pdfium.js
            packages/pdfium/src/vendor/pdfium.cjs
          if-no-files-found: warn
